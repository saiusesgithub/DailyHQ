name: Build DailyHQ

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name Android release artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DailyHQ-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyhq-android-apk
          path: build/app/outputs/flutter-apk/DailyHQ-Android.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows application
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\dailyhq.iss"'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dailyhq-windows-installer
          path: build/installer/DailyHQ-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag against application version
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$app_version" ] || [ "$tag_version" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $app_version."
            exit 1
          fi

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: dailyhq-android-apk
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dailyhq-windows-installer
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/DailyHQ-Android.apk
          release-assets/DailyHQ-Setup.exe
          --verify-tag
          --generate-notes
          --title "DailyHQ $GITHUB_REF_NAME"
