name: Feature request
description: Suggest a focused improvement to DailyHQ.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What personal workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior that would solve it.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Relevant platform
      options:
        - Windows and Android
        - Windows
        - Android
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional—mention workarounds or simpler alternatives.
